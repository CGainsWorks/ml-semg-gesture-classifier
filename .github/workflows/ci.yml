name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keras and TFLite are noisy on import and none of it is actionable in a log.
  TF_CPP_MIN_LOG_LEVEL: "2"
  # Both frameworks will happily spawn a thread per core and then contend.
  OMP_NUM_THREADS: "2"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 3.12 produced the reported numbers. The others are here to catch
        # anything that only works on that one.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel explicitly: the default PyPI torch drags in the whole
          # CUDA runtime and blows the runner's disk quota.
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check src tests experiments

      - name: Tests
        run: python -m pytest -q

  smoke:
    name: end-to-end smoke (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-dev.txt

      # Ninapro is a 200 MB download and training on it takes hours, so CI runs
      # the synthetic generator instead. This job proves that data loading,
      # filtering, windowing, splitting, training in both frameworks,
      # quantisation to TFLite int8 and ONNX int8, the embedded runtimes, the
      # latency benchmark and the streaming control loop all connect. It proves
      # nothing about accuracy, and scripts/run_smoke.sh says so on every run.
      - name: Whole pipeline on synthetic data
        run: bash scripts/run_smoke.sh

      - name: Every deployment artefact was produced
        run: |
          set -euo pipefail
          for artefact in \
              artifacts/deploy/synthetic/gesture_cnn_float32.tflite \
              artifacts/deploy/synthetic/gesture_cnn_int8.tflite \
              artifacts/deploy/synthetic/gesture_cnn_float32.onnx \
              artifacts/deploy/synthetic/gesture_cnn_int8.onnx ; do
            test -s "$artefact" || { echo "missing or empty: $artefact"; exit 1; }
            echo "ok: $artefact ($(stat -c%s "$artefact") bytes)"
          done

      - name: The int8 TFLite model is fully integer
        # A silent float fallback produces a model that runs on a desktop and
        # then fails to build for TFLite Micro. Catch it here, not on the board.
        run: |
          python - <<'PY'
          from src.quantise.tflite_export import describe
          info = describe("artifacts/deploy/synthetic/gesture_cnn_int8.tflite")
          assert info["input"]["dtype"] == "int8", info["input"]
          assert info["output"]["dtype"] == "int8", info["output"]
          print(f"int8 in and out, {info['bytes'] / 1024:.1f} KiB")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-outputs
          path: |
            results/synthetic/
            artifacts/latency_smoke.json
            artifacts/control_loop_smoke.json
            analysis/synthetic/
          retention-days: 14
          if-no-files-found: warn

  reproducible:
    name: quoted numbers come from a script
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements-dev.txt

      # The README's numbers come from committed JSON, and the checker verifies
      # every one of them is still what that JSON says. Without this, a table
      # goes stale the first time somebody reruns training and forgets to
      # update it.
      - name: README matches the committed results
        run: python -m src.check_readme

      - name: Shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "ok: $script"
          done

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ml-semg-gesture-classifier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image can run the pipeline
        run: |
          docker run --rm ml-semg-gesture-classifier:ci \
              python -m pytest -q tests/test_data.py
